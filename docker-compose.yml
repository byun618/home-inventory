services:
  mysql:
    image: mysql:8.0
    container_name: home-inventory-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ~/.db/home-inventory/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        APP: api
    container_name: home-inventory-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      args:
        APP: web
    container_name: home-inventory-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
